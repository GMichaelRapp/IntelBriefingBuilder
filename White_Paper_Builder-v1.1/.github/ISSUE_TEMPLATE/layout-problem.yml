name: Layout or output problem
description: Something on the printed pages is wrong, or the tool did not do what you expected
title: "Layout: "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which page, and what looks wrong (a note on the wrong page, a figure cut off, a heading alone at the bottom of a page).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: For example, Chrome 141 on Windows 11. Printing works best in Chrome and Edge.
  - type: textarea
    id: file
    attributes:
      label: Project file
      description: If you can share it, attach a project file (Save project) that shows the problem. Remove anything private first.
